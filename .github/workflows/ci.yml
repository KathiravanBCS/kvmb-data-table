name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: Lint, types, tests, build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      # npm 10.9 crashes resolving vitest's optional peer set; npm 11 does not.
      - run: npm install -g npm@11
      - run: npm ci
      - run: npm run format:check
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run test:types
      - run: npm run build
      - run: npm run check:exports
      - run: npm pack --dry-run
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist

  package:
    name: Clean install in a fresh app
    runs-on: ubuntu-latest
    needs: checks
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm install -g npm@11
      - run: npm ci
      - run: npm run build
      - run: npm run test:package

  mantine-9:
    name: Tests against Mantine 9
    runs-on: ubuntu-latest
    needs: checks
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm install -g npm@11
      - run: npm ci
      # Every @mantine/* package must move together: they pin each other's exact version.
      - run: npm install --no-save @mantine/core@9 @mantine/hooks@9 @mantine/dates@9 @mantine/code-highlight@9
      - run: npm run typecheck
      - run: npm test

  e2e:
    name: Playwright (light + dark, axe)
    runs-on: ubuntu-latest
    needs: checks
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm install -g npm@11
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: playwright-report
